# ============================================================
# ProxyRules — 每日自动同步与发布
# ============================================================
# 触发条件:
#   1. 外部触发: repository_dispatch (外部 cron-job.org 精准秒级触发)
#   2. 手动触发: workflow_dispatch (GitHub UI 按钮触发)
#   3. 推送触发: 推送到 main/master 分支时 (仅 config/scripts/workflow 变更)
# ============================================================

name: Sync & Release Rules

on:
  repository_dispatch:
    types: [cron_sync]

  workflow_dispatch:
    inputs:
      publish:
        description: "是否发布到 release 分支"
        type: boolean
        default: true

  push:
    branches:
      - main
      - master
    paths:
      - "config/**"
      - "scripts/**"
      - ".github/workflows/sync.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-release
  cancel-in-progress: true

jobs:

  # ==========================================================
  # Job 1: 抓取 + 清洗规则 (唯一的生产者)
  # ==========================================================
  fetch-and-filter:
    name: Fetch & Filter
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "scripts/requirements.txt"

      - name: 安装 Python 依赖
        run: pip install -r scripts/requirements.txt

      - name: 运行抓取与清洗
        timeout-minutes: 12
        run: python scripts/fetch_and_filter.py

      - name: 生成统计文件
        run: |
          echo "{" > output/stats.json
          echo "  \"timestamp\": \"$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')\"," >> output/stats.json
          for f in output/*.txt; do
            name=$(basename $f .txt)
            count=$(grep -vc '^#' $f)
            echo "  \"${name}\": ${count}," >> output/stats.json
          done
          # remove trailing comma from last entry
          sed -i '$ s/,$//' output/stats.json
          echo "}" >> output/stats.json
          cat output/stats.json

      - name: 上传 output/ (供后续 job 使用)
        uses: actions/upload-artifact@v4
        with:
          name: output-txt
          path: output/
          retention-days: 1

      - name: 打印统计
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 规则抓取统计"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          for f in output/*.txt; do
            echo "  $(basename $f): $(grep -vc '^#' $f) 条"
          done
          ls -lh output/*.txt


  # ==========================================================
  # Job 2: 编译所有产物 (Mihomo MRS + Sing-box SRS + Shadowrocket Module)
  # ==========================================================
  build-all:
    name: Build All (Mihomo + Sing-box + Shadowrocket)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: fetch-and-filter

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 下载 output 产物
        uses: actions/download-artifact@v4
        with:
          name: output-txt
          path: output/

      - name: 安装 Python 依赖
        run: pip install requests PyYAML

      # --- Mihomo 编译 ---
      - name: 编译 Mihomo MRS
        run: |
          python scripts/compile_mihomo.py
          # 为每个 .mrs 文件追加时间戳注释 (Zstandard 尾部兼容)
          SYNC_TS=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S (北京时间)')
          for mrs in build/mihomo/*.mrs; do
            printf '\n# synced: %s\n' "$SYNC_TS" >> "$mrs"
          done
          echo ""
          echo "📦 MRS 产物:"
          ls -lh build/mihomo/*.mrs

      # --- Sing-box 编译 ---
      - name: 编译 Sing-box SRS
        run: |
          python scripts/compile_singbox.py
          echo ""
          echo "📦 SRS 产物:"
          ls -lh build/sing-box/*.srs

      # --- Shadowrocket 模块 ---
      - name: 生成 Shadowrocket .module
        run: |
          python scripts/generate_sr.py
          echo "📦 SGModule 产物:"
          ls -lh build/Shadowrocket/

      # --- 整理 build 目录 ---
      - name: 整理 build 目录
        run: |
          cp output/stats.json build/
          echo ""
          echo "📦 build/ 完整且可发布的产物结构:"
          find build -type f | sort

      # --- 上传整个 build/ 给 publish job ---
      - name: 上传 build 产物
        uses: actions/upload-artifact@v4
        with:
          name: build-all
          path: build/
          retention-days: 1


  # ==========================================================
  # Job 3: 发布到 Release 分支
  # ==========================================================
  publish:
    name: Publish to Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build-all
    if: |
      (github.event_name == 'repository_dispatch') ||
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')

    steps:
      - name: Checkout 仓库 (release 分支)
        uses: actions/checkout@v4
        with:
          ref: release

      - name: 下载 build 产物
        uses: actions/download-artifact@v4
        with:
          name: build-all
          path: dist

      - name: 发布到 release 分支
        run: |
          echo "📁 下载的产物结构:"
          find dist -type f | sort

          # 保存旧的 stats.json 供 delta 计算
          if [ -f stats.json ]; then
            cp stats.json old_stats.json
          fi

          # 清空根目录
          git rm -rf --ignore-unmatch .

          # 复制所有产物到根目录 (保留子目录结构: mihomo/, sing-box/, Shadowrocket/)
          cp -r dist/* .
          rm -rf dist

          # 计算 delta (对比上一次 stats.json)
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 规则变化统计"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ -f stats.json ]; then
            if [ -f old_stats.json ]; then
              python3 -c "
          import json
          new = json.load(open('stats.json'))
          old = json.load(open('old_stats.json'))
          for k in ['direct_domain', 'direct_ip', 'reject_domain', 'reject_ip', 'no_cn_domain']:
              nc = new.get(k, 0)
              oc = old.get(k, 0)
              delta = nc - oc
              sign = '+' if delta >= 0 else ''
              print(f'  {k}: {nc} 条 (update {sign}{delta})')
          "
            else
              python3 -c "
          import json
          new = json.load(open('stats.json'))
          for k in ['direct_domain', 'direct_ip', 'reject_domain', 'reject_ip', 'no_cn_domain']:
              print(f'  {k}: {new.get(k,0)} 条')
          "
            fi
          else
            echo "  (无 stats.json)"
          fi
          # 保留 stats.json 供下次对比
          rm -f old_stats.json

          echo ""
          echo "📦 待发布文件:"
          find . -type f -not -path './.git/*' | sort

          git add -A

          TIMESTAMP=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')

          if git diff --staged --quiet; then
            echo "✅ 无变更，跳过提交"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="github-actions[bot]@users.noreply.github.com" \
                commit -m "🔄 Sync: $TIMESTAMP (北京时间)"
            git push origin release --force
            echo "✅ 已推送到 release 分支"
          fi

      - name: 更新 main 分支 README 统计
        run: |
          # stats.json 已在当前工作目录中 (publish 步骤复制进去了)
          if [ ! -f stats.json ]; then
            echo "⚠️ stats.json 未找到，跳过 README 更新"
            exit 0
          fi

          NEW_TS=$(python3 -c "import json; print(json.load(open('stats.json'))['timestamp'])")
          NEW_DIRECT_DOMAIN=$(python3 -c "import json; print(json.load(open('stats.json')).get('direct_domain',0))")
          NEW_DIRECT_IP=$(python3 -c "import json; print(json.load(open('stats.json')).get('direct_ip',0))")
          NEW_REJECT_DOMAIN=$(python3 -c "import json; print(json.load(open('stats.json')).get('reject_domain',0))")
          NEW_REJECT_IP=$(python3 -c "import json; print(json.load(open('stats.json')).get('reject_ip',0))")
          NEW_NO_CN_DOMAIN=$(python3 -c "import json; print(json.load(open('stats.json')).get('no_cn_domain',0))")

          # 获取 main 分支上的 README
          git fetch origin main
          git checkout origin/main -- README.md

          # 读取 README 中的旧数据算 delta
          OLD_DIRECT_DOMAIN=$(grep -oP 'DIRECT_DOMAIN 规则数：\s*\K[\d,]+' README.md | sed 's/,//g' || echo 0)
          OLD_DIRECT_IP=$(grep -oP 'DIRECT_IP 规则数：\s*\K[\d,]+' README.md | sed 's/,//g' || echo 0)
          OLD_REJECT_DOMAIN=$(grep -oP 'REJECT_DOMAIN 规则数：\s*\K[\d,]+' README.md | sed 's/,//g' || echo 0)
          OLD_REJECT_IP=$(grep -oP 'REJECT_IP 规则数：\s*\K[\d,]+' README.md | sed 's/,//g' || echo 0)
          OLD_NO_CN_DOMAIN=$(grep -oP 'NO_CN_DOMAIN 规则数：\s*\K[\d,]+' README.md | sed 's/,//g' || echo 0)

          DDD_DELTA=$((NEW_DIRECT_DOMAIN - OLD_DIRECT_DOMAIN))
          DDI_DELTA=$((NEW_DIRECT_IP - OLD_DIRECT_IP))
          RJD_DELTA=$((NEW_REJECT_DOMAIN - OLD_REJECT_DOMAIN))
          RJI_DELTA=$((NEW_REJECT_IP - OLD_REJECT_IP))
          NCD_DELTA=$((NEW_NO_CN_DOMAIN - OLD_NO_CN_DOMAIN))

          DDD_SIGN=$( [ $DDD_DELTA -ge 0 ] && echo '+' || echo '' )
          DDI_SIGN=$( [ $DDI_DELTA -ge 0 ] && echo '+' || echo '' )
          RJD_SIGN=$( [ $RJD_DELTA -ge 0 ] && echo '+' || echo '' )
          RJI_SIGN=$( [ $RJI_DELTA -ge 0 ] && echo '+' || echo '' )
          NCD_SIGN=$( [ $NCD_DELTA -ge 0 ] && echo '+' || echo '' )

          # 更新 README 中的统计行
          sed -i "s/最后更新时间：.*/最后更新时间：${NEW_TS}/" README.md
          sed -i "s/DIRECT_DOMAIN 规则数：[0-9,]*，update [+-][0-9,]*/DIRECT_DOMAIN 规则数：$(printf "%'d" $NEW_DIRECT_DOMAIN)，update ${DDD_SIGN}${DDD_DELTA}/" README.md
          sed -i "s/DIRECT_IP 规则数：[0-9,]*，update [+-][0-9,]*/DIRECT_IP 规则数：$(printf "%'d" $NEW_DIRECT_IP)，update ${DDI_SIGN}${DDI_DELTA}/" README.md
          sed -i "s/REJECT_DOMAIN 规则数：[0-9,]*，update [+-][0-9,]*/REJECT_DOMAIN 规则数：$(printf "%'d" $NEW_REJECT_DOMAIN)，update ${RJD_SIGN}${RJD_DELTA}/" README.md
          sed -i "s/REJECT_IP 规则数：[0-9,]*，update [+-][0-9,]*/REJECT_IP 规则数：$(printf "%'d" $NEW_REJECT_IP)，update ${RJI_SIGN}${RJI_DELTA}/" README.md
          sed -i "s/NO_CN_DOMAIN 规则数：[0-9,]*，update [+-][0-9,]*/NO_CN_DOMAIN 规则数：$(printf "%'d" $NEW_NO_CN_DOMAIN)，update ${NCD_SIGN}${NCD_DELTA}/" README.md

          echo "README 统计已更新:"
          grep -E '(最后更新|DIRECT_DOMAIN|DIRECT_IP|REJECT_DOMAIN|REJECT_IP|NO_CN_DOMAIN)' README.md

      - name: 推送 README 更新到 main
        run: |
          git add README.md
          if git diff --staged --quiet; then
            echo "✅ README 无变更，跳过推送"
          else
            TIMESTAMP=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
            # 基于 origin/main 的 tree，只替换 README，避免污染 main 分支
            MAINTREE=$(git rev-parse origin/main^{tree})
            READMEBLOB=$(git hash-object -w README.md)
            NEWTREE=$( ( echo "100644 blob ${READMEBLOB}"$'\t'"README.md"; git ls-tree "$MAINTREE" | grep -v 'README.md' ) | git mktree)
            PARENT=$(git rev-parse origin/main)
            COMMIT=$(git -c user.name="github-actions[bot]" \
                         -c user.email="github-actions[bot]@users.noreply.github.com" \
                         commit-tree "$NEWTREE" -p "$PARENT" -m "📊 更新统计: $TIMESTAMP (北京时间)")
            git push origin "$COMMIT":refs/heads/main
            echo "✅ README 已推送到 main 分支"
          fi

      - name: 发布摘要
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 发布完成"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Mihomo MRS 二进制订阅:"
          echo "  https://raw.githubusercontent.com/${{ github.repository }}/release/mihomo/direct_domain.mrs"
          echo "  https://raw.githubusercontent.com/${{ github.repository }}/release/mihomo/direct_ip.mrs"
          echo "  https://raw.githubusercontent.com/${{ github.repository }}/release/mihomo/private_domain.mrs"
          echo "  https://raw.githubusercontent.com/${{ github.repository }}/release/mihomo/private_ip.mrs"
          echo "  https://raw.githubusercontent.com/${{ github.repository }}/release/mihomo/reject_domain.mrs"
          echo "  https://raw.githubusercontent.com/${{ github.repository }}/release/mihomo/reject_ip.mrs"
          echo "  https://raw.githubusercontent.com/${{ github.repository }}/release/mihomo/no_cn_domain.mrs"
          echo ""
          echo "Sing-box SRS 二进制订阅:"
          echo "  https://raw.githubusercontent.com/${{ github.repository }}/release/sing-box/direct_domain.srs"
          echo "  https://raw.githubusercontent.com/${{ github.repository }}/release/sing-box/direct_ip.srs"
          echo "  https://raw.githubusercontent.com/${{ github.repository }}/release/sing-box/private_domain.srs"
          echo "  https://raw.githubusercontent.com/${{ github.repository }}/release/sing-box/private_ip.srs"
          echo "  https://raw.githubusercontent.com/${{ github.repository }}/release/sing-box/reject_domain.srs"
          echo "  https://raw.githubusercontent.com/${{ github.repository }}/release/sing-box/reject_ip.srs"
          echo "  https://raw.githubusercontent.com/${{ github.repository }}/release/sing-box/no_cn_domain.srs"
          echo ""
          echo "Shadowrocket SGModule 订阅:"
          echo "  https://raw.githubusercontent.com/${{ github.repository }}/release/Shadowrocket/direct.module"
          echo "  https://raw.githubusercontent.com/${{ github.repository }}/release/Shadowrocket/reject.module"
          echo "  https://raw.githubusercontent.com/${{ github.repository }}/release/Shadowrocket/proxy.module"
